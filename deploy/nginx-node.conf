# Public Bytecoin node RPC for browser wallets: only the paths a wallet needs, with CORS and a per-IP rate limit.
limit_req_zone $binary_remote_addr zone=bcn_rpc:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=bcn_static:10m rate=50r/s;
limit_req_status 429;
# Static sync blocks below the last hard checkpoint never change; bytecoind marks them cacheable for a month.
proxy_cache_path /var/cache/nginx/bcn levels=1:2 keys_zone=bcn_cache:20m max_size=6g inactive=60d use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name node.bytecoin.community;

    client_max_body_size 1m;
    server_tokens off;

    location = / {
        default_type text/plain;
        return 200 "Bytecoin (BCN) public node, run by the Bytecoin community.\nRPC: POST /json_rpc, POST /binary_rpc, GET /sync_blocks/...\nhttps://bytecoin.community\n";
    }

    location ~ ^/(json_rpc|binary_rpc)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Access-Control-Max-Age 86400 always;
        if ($request_method = OPTIONS) { return 204; }
        if ($request_method != POST) { return 405; }

        limit_req zone=bcn_rpc burst=200 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Connection "";
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_read_timeout 120s;
    }

    location ~ ^/sync_blocks/[0-9A-Za-z._/-]+$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header X-Cache $upstream_cache_status always;
        if ($request_method = OPTIONS) { return 204; }
        # While the node is still syncing it would answer with fewer blocks; such answers must never be cached.
        if (-f /etc/nginx/bcn-syncing) { return 503; }
        limit_except GET { deny all; }

        limit_req zone=bcn_static burst=400 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Connection "";
        proxy_set_header Origin "";
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_cache bcn_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_read_timeout 120s;
    }

    location / { return 404; }
}
