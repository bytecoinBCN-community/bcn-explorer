# Bytecoin Explorer: static files only, data is fetched by the browser from node.bytecoin.community.
server {
    listen 80;
    listen [::]:80;
    server_name explorer.bytecoin.community;
    root /var/www/bcn-explorer;
    index index.html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://node.bytecoin.community; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /index.html { add_header Cache-Control "no-cache" always; add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://node.bytecoin.community; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; }
    location ~ \.(js|css)$ { add_header Cache-Control "public, max-age=300" always; add_header X-Content-Type-Options nosniff always; }
    location / { try_files $uri $uri/ =404; }
}
