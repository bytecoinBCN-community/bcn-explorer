<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://node.bytecoin.community; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Bytecoin (BCN) block explorer: blocks, transactions, mempool and payment proof checks, served from a community node.">
<title>Bytecoin Explorer</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#/"><img src="logo-192.png" width="34" height="34" alt=""><span>Bytecoin Explorer</span></a>
    <nav>
      <a href="#/">Blocks</a>
      <a href="#/mempool">Mempool</a>
      <a href="#/proof">Check a payment</a>
      <a href="https://bytecoin.community">bytecoin.community</a>
    </nav>
  </div>
  <div class="wrap">
    <form id="search" class="search" role="search">
      <input id="q" type="search" autocomplete="off" spellcheck="false" aria-label="Search" placeholder="Block height, block hash or transaction hash">
      <button type="submit">Search</button>
    </form>
  </div>
</header>

<main class="wrap" id="view" aria-live="polite"></main>

<footer class="wrap foot">
  <p>Data comes straight from our own node, <a href="https://node.bytecoin.community">node.bytecoin.community</a>. No cookies, no tracking.</p>
  <p>There is no address search on purpose: Bytecoin hides senders, receivers and balances, so no explorer can show them.</p>
</footer>
<script src="app.js"></script>
</body>
</html>
